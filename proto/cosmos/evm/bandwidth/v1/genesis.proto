syntax = "proto3";
package cosmos.evm.bandwidth.v1;

import "gogoproto/gogo.proto";
import "cosmos/evm/bandwidth/v1/bandwidth.proto";

option go_package = "github.com/cosmos/evm/x/bandwidth/types";

// GenesisState defines the bandwidth module's genesis state.
message GenesisState {
  Params params = 1 [ (gogoproto.nullable) = false ];
  repeated Device devices = 2 [ (gogoproto.nullable) = false ];
}
